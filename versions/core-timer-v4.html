<style>
  :root{
    --bg:#FBFAF8;
    --panel:#F3F0EB;
    --line:#E4DED5;
    --track:#E6E1D9;
    --ink:#1E2124;
    --dim:#71767C;
    --accent:#D97757;
    --soft-bg:rgba(217,119,87,.13);
    --soft-br:rgba(217,119,87,.34);
    --soft-tx:#B0512F;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#15181B;
      --panel:#1E2328;
      --line:#2B3137;
      --track:#282E34;
      --ink:#ECE9E4;
      --dim:#8B9299;
      --accent:#E08A6D;
      --soft-bg:rgba(224,138,109,.15);
      --soft-br:rgba(224,138,109,.36);
      --soft-tx:#EEA88D;
    }
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
    display:flex;justify-content:center}
  #app{width:100%;max-width:420px;height:100%;
    padding:calc(26px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column}

  /* ── строка состояния ───────────────────────────────── */
  .status{font-size:15px;color:var(--dim);text-align:center;letter-spacing:.005em}
  .status b{font-family:var(--mono);color:var(--ink);font-weight:500;
    font-variant-numeric:tabular-nums;font-size:15px}

  /* ── плашка упражнения: как уведомление, не кнопка ──── */
  .card{background:var(--panel);border-radius:15px;padding:14px 16px;margin-top:18px}
  .exline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .exname{font-size:18px;font-weight:600;letter-spacing:-.012em}
  .reps{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
  .hint{font-size:12.5px;line-height:1.5;color:var(--dim);margin-top:7px}

  /* ── циферблат ──────────────────────────────────────── */
  .dial{position:relative;display:flex;align-items:center;justify-content:center;margin-top:24px}
  .dial svg{width:100%;max-width:272px;max-height:34vh;height:auto;
    transform:rotate(-90deg);display:block}
  .ring-bg{fill:none;stroke:var(--track);stroke-width:2}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px}
  .time{font-family:var(--mono);font-size:62px;font-weight:500;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;line-height:1}
  .round{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
    color:var(--dim);text-transform:uppercase}

  /* ── круги ──────────────────────────────────────────── */
  .rounds{display:flex;gap:14px;padding:0 2px;margin-top:24px}
  .grp{flex:1;display:flex;flex-direction:column;align-items:center;gap:0}
  .pills{display:flex;gap:4px;width:100%}
  .hit{flex:1;padding:11px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .seg{width:100%;height:10px;border-radius:5px;background:var(--track);
    position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);
    transition:box-shadow .15s}
  .hit:active .seg{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .seg .fill{position:absolute;top:0;left:0;bottom:0;width:0;background:var(--accent)}
  .seg.done .fill{width:100%}
  .num{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .grp.active .num{color:var(--ink)}

  .tapnote{font-size:12.5px;line-height:1.5;color:var(--dim);
    text-align:center;padding:0 4px;margin-top:7px}
  .next{display:flex;align-items:center;justify-content:center;gap:9px;
    font-size:14px;color:var(--dim);margin-top:18px}
  .next .arrow{font-size:19px;line-height:1;color:var(--accent)}
  .next b{color:var(--ink);font-weight:500}

  .spacer{flex:0 0 24px}
  .tail{flex:1 1 auto;min-height:16px}

  /* ── кнопки ─────────────────────────────────────────── */
  .controls{display:flex;gap:10px;position:relative;isolation:isolate;
    transform:translateZ(0)}
  button{flex:1;font-family:inherit;font-size:15px;font-weight:500;border-radius:12px;
    padding:17px 12px;cursor:pointer;text-align:center;border:1px solid transparent;
    -webkit-tap-highlight-color:transparent;backface-visibility:hidden;
    -webkit-backface-visibility:hidden;transform:translateZ(0)}
  button:active{filter:brightness(.92)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #reset{background:transparent;border-color:var(--line);color:var(--dim)}
  /* пауза — приглушённая: останавливающее действие */
  #main{background:var(--soft-bg);border-color:var(--soft-br);color:var(--soft-tx);font-weight:600}
  /* старт и продолжить — сплошной оранжевый: движение вперёд */
  #main.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  .foot{font-size:12.5px;line-height:1.5;color:var(--dim);text-align:center;
    padding:0 4px;margin-top:16px}
  .foot b{color:var(--ink);font-weight:500}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-height:680px){
    .dial{margin-top:16px} .rounds{margin-top:16px} .next{margin-top:14px}
    .card{margin-top:14px} .spacer{flex-basis:16px} .tail{min-height:0}
  }
</style>

<div id="app">
  <div class="status" id="status">4 круга · 9,5 минут</div>

  <div class="card">
    <div class="exline">
      <span class="exname" id="exname">Приготовься</span>
      <span class="reps" id="reps">10 сек</span>
    </div>
    <div class="hint" id="hint">Ляг на спину, руки за голову. Старт по сигналу.</div>
  </div>

  <div class="dial">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <circle class="ring-bg" cx="120" cy="120" r="110"></circle>
      <circle class="ring-fg" id="ring" cx="120" cy="120" r="110"></circle>
    </svg>
    <div class="center">
      <div class="time" id="time">0:10</div>
      <div class="round" id="round">Приготовься</div>
    </div>
  </div>

  <div class="rounds" id="rounds"></div>

  <div class="next" id="next"><span class="arrow">→</span><span id="nexttext">Велосипед · круг 1</span></div>

  <div class="spacer"></div>

  <div class="controls">
    <button id="reset" hidden>Сброс</button>
    <button id="main" class="primary">Начать тренировку</button>
  </div>

  <div class="foot" id="foot">Сигналы: <b>вверх</b> — велосипед, <b>вниз</b> — супермен, <b>двойной</b> — смена через 10 секунд.</div>
  <div class="tapnote" id="tapnote">Нажми на отрезок, если подход уже сделан</div>

  <div class="tail"></div>
</div>

<script>
(function(){
  var BIKE={key:'bike',name:'Велосипед',dur:60,reps:'15–20 на сторону',
    hint:'На спине. Медленно, без рывков — скручивание, а не махи ногами. Последние повторы должны даваться тяжело.'};
  var SUPER={key:'super',name:'Супермен',dur:80,reps:'12 повторов',
    hint:'На животе. Отрыв рук и ног, задержка 2–3 секунды вверху, медленное опускание.'};
  var PREP={key:'prep',name:'Приготовься',dur:10,reps:'10 сек',
    hint:'Ляг на спину, руки за голову. Старт по сигналу.'};

  var phases=[Object.assign({},PREP)];
  for(var r=1;r<=4;r++){
    phases.push(Object.assign({round:r},BIKE));
    phases.push(Object.assign({round:r},SUPER));
  }

  var idx=0,running=false,phaseEnd=0,remain=phases[0].dur,warned=false,
      rafId=null,wakeLock=null,audio=null,finished=false;

  var $=function(i){return document.getElementById(i)};
  var elTime=$('time'),elRound=$('round'),elName=$('exname'),elReps=$('reps'),elHint=$('hint'),
      elNextText=$('nexttext'),elRing=$('ring'),elRounds=$('rounds'),elMain=$('main'),
      elReset=$('reset'),elFoot=$('foot'),elStatus=$('status'),elTap=$('tapnote');

  var C=2*Math.PI*110;
  elRing.style.strokeDasharray=C;

  var segs=[],grps=[],fills=[];
  (function build(){
    for(var r=1;r<=4;r++){
      var g=document.createElement('div'); g.className='grp';
      var p=document.createElement('div'); p.className='pills';
      ['bike','super'].forEach(function(k){
        var hit=document.createElement('div'); hit.className='hit';
        var s=document.createElement('div'); s.className='seg '+k;
        var f=document.createElement('div'); f.className='fill';
        s.appendChild(f); hit.appendChild(s); p.appendChild(hit);
        segs.push(s); fills.push(f);
        var n=segs.length;                 // номер слота: 1…8
        hit.addEventListener('click',function(){ jumpTo(n); });
      });
      var n=document.createElement('div'); n.className='num'; n.textContent=r;
      g.appendChild(p); g.appendChild(n); elRounds.appendChild(g); grps.push(g);
    }
  })();

  function ctx(){
    if(!audio){var A=window.AudioContext||window.webkitAudioContext; if(A)audio=new A();}
    if(audio&&audio.state==='suspended')audio.resume();
    return audio;
  }
  // ── Звук ────────────────────────────────────────────────
  // Калимба: чистый тон плюс тихая третья гармоника, быстрая атака,
  // плавное затухание. Колокол — для финального аккорда.
  var MASTER=1;
  function voice(inst,f,dur,delay,vol){
    var a=ctx(); if(!a)return;
    var t=a.currentTime+(delay||0), v=(vol===undefined?1:vol)*MASTER;
    var g=a.createGain(); g.connect(a.destination);
    var o=a.createOscillator(); o.type='sine'; o.frequency.value=f;

    if(inst==='bell'){
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.7,t+.004);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var p=a.createOscillator(), pg=a.createGain();
      p.type='sine'; p.frequency.value=f*2.76; pg.gain.value=.3;
      p.connect(pg); pg.connect(g); p.start(t); p.stop(t+dur);
    }else{ // kalimba
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.7,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var k=a.createOscillator(), kg=a.createGain();
      k.type='sine'; k.frequency.value=f*3; kg.gain.value=.16;
      k.connect(kg); kg.connect(g); k.start(t); k.stop(t+dur*.55);
    }
    o.connect(g); o.start(t); o.stop(t+dur+.05);
  }

  // Велосипед — две ноты вверх, супермен — вниз.
  function sigBike(){  voice('kalimba',587,.75,0);  voice('kalimba',880,1.0,.2); }
  function sigSuper(){ voice('kalimba',880,.75,0);  voice('kalimba',523,1.1,.2); }
  function sigWarn(){  voice('kalimba',740,.4,0);     voice('kalimba',740,.4,.17); }
  function sigStart(){ voice('kalimba',523,.7,.08); }

  function announce(p){
    if(p.key==='bike')sigBike();
    else if(p.key==='super')sigSuper();
  }
  function warn(){ sigWarn(); }
  function finishSound(){
    voice('bell',523,1.6,0,.6);
    voice('bell',659,1.6,.02,.6);
    voice('bell',784,2,.04,.6);
  }

  async function lockScreen(){
    try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
  }
  function unlockScreen(){ try{ if(wakeLock){wakeLock.release(); wakeLock=null;} }catch(e){} }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&running)lockScreen();
  });

  function fmt(s){ s=Math.max(0,Math.ceil(s)); var m=Math.floor(s/60),r=s%60;
    return m+':'+(r<10?'0':'')+r; }

  // Кольцо перерисовывается каждый кадр — от этого зависит плавность.
  // Всё остальное меняется только когда действительно изменилось.
  var lastIdx=-1, lastTime='', lastStatus='', lastPct=-1;

  function renderPhase(){          // раз в слот, то есть раз в 80–100 секунд
    var p=phases[idx], nx=phases[idx+1];
    elName.textContent=p.name;
    elReps.textContent=p.reps;
    elHint.textContent=p.hint;
    elRound.textContent=p.key==='prep'?'Приготовься':'Круг '+p.round+' из 4';

    while(elNextText.firstChild)elNextText.removeChild(elNextText.firstChild);
    if(nx){
      var b=document.createElement('b'); b.textContent=nx.name;
      elNextText.appendChild(b);
      elNextText.appendChild(document.createTextNode(' · круг '+(nx.round||1)));
    }else{
      elNextText.appendChild(document.createTextNode('Конец тренировки'));
    }

    for(var i=0;i<segs.length;i++){
      var pi=i+1;
      segs[i].classList.toggle('done',pi<idx);
      if(pi!==idx)fills[i].style.width=(pi<idx?'100%':'0%');
    }
    for(var g=0;g<grps.length;g++)grps[g].classList.toggle('active',p.round===g+1);
    lastPct=-1;
  }

  function setStatus(txt,bold){     // без разбора разметки
    while(elStatus.firstChild)elStatus.removeChild(elStatus.firstChild);
    elStatus.appendChild(document.createTextNode(txt));
    if(bold){ var b=document.createElement('b'); b.textContent=bold;
              elStatus.appendChild(b); }
  }

  function render(){
    var p=phases[idx], frac=p.dur>0?remain/p.dur:0;

    if(idx!==lastIdx){ lastIdx=idx; renderPhase(); }

    elRing.style.strokeDashoffset=C*(1-frac);   // каждый кадр

    var t=fmt(remain);                          // раз в секунду
    if(t!==lastTime){ lastTime=t; elTime.textContent=t; }

    var pct=Math.round((1-frac)*100);           // шаг 1%: глазу не видно
    if(pct!==lastPct && fills[idx-1]){ lastPct=pct; fills[idx-1].style.width=pct+'%'; }

    var left=0; for(var j=idx;j<phases.length;j++)left+=(j===idx?remain:phases[j].dur);
    var st=(running||idx>0)?'Осталось '+fmt(left):'4 круга · 9,5 минут';
    if(st!==lastStatus){
      lastStatus=st;
      if(running||idx>0)setStatus('Осталось ',fmt(left));
      else setStatus('4 круга · 9,5 минут');
    }
  }

  // Нажатие на отрезок означает «этот подход сделан».
  // Отрезок заливается, таймер переходит к следующему.
  function jumpTo(n){
    if(n<1||n>phases.length-1)return;   // n — номер отрезка, 1…8
    var next=n+1;
    if(next>=phases.length){ done(); return; }   // отмечен последний
    if(finished){ finished=false; elFoot.hidden=true; }
    idx=next;
    remain=phases[idx].dur;
    phaseEnd=Date.now()+remain*1000;
    warned=false;
    lastPct=-1;
    if(running){
      announce(phases[idx]);
    }else{
      elMain.textContent='Продолжить';
      elMain.classList.add('primary');
      elReset.hidden=false;
    }
    render();
  }

  function tick(){
    if(!running)return;
    remain=(phaseEnd-Date.now())/1000;
    if(!warned&&phases[idx+1]&&remain<=10&&phases[idx].key!=='prep'){
      warned=true; warn();
    }
    if(remain<=0){
      idx++;
      if(idx>=phases.length){done(); return;}
      remain=phases[idx].dur; phaseEnd=Date.now()+remain*1000; warned=false;
      announce(phases[idx]);
    }
    render();
    rafId=requestAnimationFrame(tick);
  }

  function start(){
    ctx();
    elFoot.hidden=true;

    running=true; finished=false;
    elTap.hidden=true;
    phaseEnd=Date.now()+remain*1000; warned=false;
    elMain.textContent='Пауза'; elMain.classList.remove('primary');
    elReset.hidden=false;
    lockScreen(); sigStart();
    rafId=requestAnimationFrame(tick);
  }

  function pause(){
    running=false; if(rafId)cancelAnimationFrame(rafId); unlockScreen();
    elMain.textContent='Продолжить'; elMain.classList.add('primary'); render();
  }

  function reset(){
    running=false; finished=false;
    if(rafId)cancelAnimationFrame(rafId); unlockScreen();
    idx=0; remain=phases[0].dur; warned=false;
    lastIdx=-1; lastTime=''; lastStatus=''; lastPct=-1;
    elMain.textContent='Начать тренировку'; elMain.classList.add('primary');
    elReset.hidden=true;
    elFoot.hidden=false; elTap.hidden=false;
    elFoot.innerHTML='Сигналы: <b>вверх</b> — велосипед, <b>вниз</b> — супермен, <b>двойной</b> — смена через 10 секунд.';
    render();
  }

  function done(){
    running=false; finished=true;
    if(rafId)cancelAnimationFrame(rafId); unlockScreen();
    idx=phases.length-1; remain=0; render();
    elTime.textContent='0:00';
    elRound.textContent='Готово';
    elName.textContent='Тренировка окончена';
    elReps.textContent='8 подходов';
    elHint.textContent='Если это третья тренировка на неделе — недельный объём набран: 12 подходов на пресс, 12 на разгибатели.';
    elNextText.textContent='Следующая через день';
    elRing.style.strokeDashoffset=0;
    setStatus('Сессия завершена'); lastStatus='Сессия завершена';
    for(var i=0;i<segs.length;i++){
      segs[i].classList.add('done');
      fills[i].style.width='100%';
    }
    for(var g=0;g<grps.length;g++)grps[g].classList.add('active');
    elMain.textContent='Начать заново'; elMain.classList.add('primary');
    elReset.hidden=true; elFoot.hidden=true;
    finishSound();
  }

  elMain.addEventListener('click',function(){
    if(finished){reset(); return;}
    running?pause():start();
  });
  elReset.addEventListener('click',reset);

  render();
})();
</script>
