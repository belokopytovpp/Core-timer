<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Звуки</title>
<style>
  :root{
    --bg:#FBFAF8; --panel:#F3F0EB; --line:#E4DED5; --ink:#1E2124; --dim:#71767C;
    --accent:#D97757; --soft-bg:rgba(217,119,87,.13); --soft-br:rgba(217,119,87,.34);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15181B; --panel:#1E2328; --line:#2B3137; --ink:#ECE9E4; --dim:#8B9299;
      --accent:#E08A6D; --soft-bg:rgba(224,138,109,.15); --soft-br:rgba(224,138,109,.36);}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center}
  #app{width:100%;max-width:420px;padding:24px 20px 40px}
  h1{font-size:19px;font-weight:600;margin:0 0 4px}
  .lead{font-size:13px;line-height:1.5;color:var(--dim);margin:0 0 22px}

  .vol{background:var(--panel);border-radius:14px;padding:13px 15px;margin-bottom:24px}
  .vol label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}
  .vol b{font-family:var(--mono);font-weight:500}
  input[type=range]{width:100%;accent-color:var(--accent)}

  .group{margin-bottom:26px}
  .gtitle{font-size:15px;font-weight:600;margin-bottom:3px}
  .gsub{font-size:12px;color:var(--dim);margin-bottom:11px}
  .row{display:flex;gap:9px;align-items:center;margin-bottom:8px}
  .tag{font-family:var(--mono);font-size:11px;color:var(--dim);width:22px;flex:none}
  button{flex:1;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:14px 12px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{background:var(--soft-bg);border-color:var(--soft-br)}
  button .desc{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:400}
  .keep{border-left:3px solid var(--accent)}

  .seq{margin-top:8px}
  .seq button{background:var(--accent);border-color:var(--accent);color:#fff;
    text-align:center;font-weight:600}
</style>

<div id="app">
  <h1>Звуковая лаборатория</h1>
  <p class="lead">Тембр везде маримба или калимба. Отличается логика: сколько нот, в каком регистре, с каким ритмом. Оранжевой чертой отмечено то, что было раньше.</p>

  <div class="vol">
    <label>Громкость <b id="volval">70%</b></label>
    <input type="range" id="vol" min="10" max="100" value="70">
  </div>

  <div id="groups"></div>

  <div class="seq">
    <button id="playall">Проиграть подряд: старт → велосипед → предупреждение → супермен</button>
  </div>
</div>

<script>
(function(){
  var AC=window.AudioContext||window.webkitAudioContext, ac=null, master=.7;
  function ctx(){ if(!ac&&AC)ac=new AC(); if(ac&&ac.state==='suspended')ac.resume(); return ac; }

  var noiseBuf=null;
  function noise(a){
    if(noiseBuf)return noiseBuf;
    var n=a.sampleRate*.5, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    noiseBuf=b; return b;
  }

  function voice(inst,f,dur,delay,vol){
    var a=ctx(); if(!a)return;
    var t=a.currentTime+(delay||0), v=(vol===undefined?1:vol)*master;
    var g=a.createGain(); g.connect(a.destination);

    if(inst==='wood'){
      var s=a.createBufferSource(); s.buffer=noise(a);
      var bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=8;
      g.gain.setValueAtTime(v*.9,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.05,dur));
      s.connect(bp); bp.connect(g); s.start(t); s.stop(t+dur+.05);
      return;
    }

    if(inst==='pluck'){                       // щипок струны
      var o1=a.createOscillator(); o1.type='sawtooth'; o1.frequency.value=f;
      var lp=a.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=1;
      lp.frequency.setValueAtTime(f*8,t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(200,f*1.2),t+dur*.7);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.6,t+.005);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o1.connect(lp); lp.connect(g); o1.start(t); o1.stop(t+dur+.05);
      return;
    }

    if(inst==='tom'){                         // барабан с падающей высотой
      var od=a.createOscillator(); od.type='sine';
      od.frequency.setValueAtTime(f*1.7,t);
      od.frequency.exponentialRampToValueAtTime(f,t+.13);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.9,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      od.connect(g); od.start(t); od.stop(t+dur+.05);
      return;
    }

    if(inst==='bowl'){                        // поющая чаша, два близких тона
      [f,f*1.004].forEach(function(fr){
        var ob=a.createOscillator(); ob.type='sine'; ob.frequency.value=fr;
        var gb=a.createGain(); gb.gain.value=.5; ob.connect(gb); gb.connect(g);
        ob.start(t); ob.stop(t+dur);
      });
      var pb=a.createOscillator(), pbg=a.createGain();
      pb.type='sine'; pb.frequency.value=f*2.4; pbg.gain.value=.14;
      pb.connect(pbg); pbg.connect(g); pb.start(t); pb.stop(t+dur);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.55,t+.05);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      return;
    }

    var o=a.createOscillator(); o.type='sine'; o.frequency.value=f;

    if(inst==='soft'){
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.55,t+.035);
      g.gain.setValueAtTime(v*.55,t+dur*.55);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    }else if(inst==='marimba'){
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.85,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var h=a.createOscillator(), hg=a.createGain();
      h.type='sine'; h.frequency.value=f*4; hg.gain.value=.12;
      h.connect(hg); hg.connect(g); h.start(t); h.stop(t+dur*.4);
    }else if(inst==='kalimba'){               // мягче маримбы, длиннее хвост
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.7,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var k=a.createOscillator(), kg=a.createGain();
      k.type='sine'; k.frequency.value=f*3; kg.gain.value=.16;
      k.connect(kg); kg.connect(g); k.start(t); k.stop(t+dur*.55);
    }else if(inst==='glass'){                 // светлый, звонкий, короткий
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.6,t+.004);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var q=a.createOscillator(), qg=a.createGain();
      q.type='sine'; q.frequency.value=f*5.4; qg.gain.value=.22;
      q.connect(qg); qg.connect(g); q.start(t); q.stop(t+dur*.6);
    }else if(inst==='blip'){                  // приглушённый, без блеска
      var lp2=a.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=f*2.2;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.7,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.type='triangle'; o.connect(lp2); lp2.connect(g);
      o.start(t); o.stop(t+dur+.05); return;
    }else{ // bell
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.7,t+.004);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var p=a.createOscillator(), pg=a.createGain();
      p.type='sine'; p.frequency.value=f*2.76; pg.gain.value=.3;
      p.connect(pg); pg.connect(g); p.start(t); p.stop(t+dur);
    }
    o.connect(g); o.start(t); o.stop(t+dur+.05);
  }

  function play(seq){ ctx(); seq.forEach(function(n){ voice(n[0],n[1],n[2],n[3],n[4]); }); }

  var SIGNALS={
    bike:{title:'Велосипед', sub:'высокий регистр', items:[
      ['Маримба: две ноты вверх','было раньше',            [['marimba',587,.5,0],['marimba',880,.7,.19]], 1],
      ['Калимба: две ноты вверх','мягче, хвост длиннее',   [['kalimba',587,.75,0],['kalimba',880,1.0,.2]], 1],
      ['Созвучие','две ноты одновременно, открытая кварта',[['marimba',659,.65,0],['marimba',988,.8,0]]],
      ['Пробежка','три ноты быстро вверх',                 [['marimba',587,.3,0],['marimba',740,.3,.1],['marimba',988,.6,.2]]],
      ['Один удар','одна нота, высоко',                    [['marimba',988,.6,0]]],
      ['Частая двойка','две одинаковые ноты подряд, быстро',[['marimba',880,.28,0],['marimba',880,.5,.12]]]
    ]},
    super:{title:'Супермен', sub:'низкий регистр — противоположность велосипеду', items:[
      ['Маримба: две ноты вниз','было раньше',             [['marimba',880,.5,0],['marimba',523,.75,.19]], 1],
      ['Калимба: две ноты вниз','мягче, хвост длиннее',    [['kalimba',880,.75,0],['kalimba',523,1.1,.2]], 1],
      ['Созвучие','две ноты одновременно, низко',          [['marimba',330,.7,0],['marimba',494,.85,0]]],
      ['Пробежка','три ноты быстро вниз',                  [['marimba',784,.3,0],['marimba',587,.3,.1],['marimba',392,.7,.2]]],
      ['Один удар','одна нота, низко',                     [['marimba',392,.75,0]]],
      ['Редкая двойка','две одинаковые ноты, с паузой',    [['marimba',440,.35,0],['marimba',440,.6,.32]]]
    ]},
    warn:{title:'Предупреждение', sub:'за 10 секунд до смены', items:[
      ['Маримба ×2','было раньше',                         [['marimba',700,.22,0,.7],['marimba',700,.22,.16,.7]], 1],
      ['Калимба ×2','мягкая двойка',                       [['kalimba',740,.4,0,.7],['kalimba',740,.4,.17,.7]], 1],
      ['Дробь','четыре очень быстрые ноты',                [['marimba',880,.14,0,.55],['marimba',880,.14,.08,.55],['marimba',880,.14,.16,.55],['marimba',880,.2,.24,.55]]],
      ['Тихая одиночная','один негромкий удар',            [['kalimba',1050,.45,0,.5]]],
      ['Качели','две ноты через терцию, туда-обратно',     [['marimba',784,.2,0,.6],['marimba',659,.2,.14,.6],['marimba',784,.3,.28,.6]]]
    ]},
    start:{title:'Старт', sub:'при нажатии кнопки', items:[
      ['Маримба','было раньше',                            [['marimba',523,.45,0,.8]], 1],
      ['Калимба','мягкий одиночный',                       [['kalimba',523,.7,0,.8]], 1],
      ['Разбег','три ноты быстро вверх',                   [['marimba',392,.25,0,.8],['marimba',523,.25,.09,.8],['marimba',659,.55,.18,.8]]],
      ['Созвучие','две ноты вместе, спокойно',             [['kalimba',392,.8,0,.75],['kalimba',587,.9,0,.75]]]
    ]},
    done:{title:'Финиш', sub:'конец тренировки', items:[
      ['Аккорд','было раньше — три ноты вместе',           [['bell',523,1.6,0,.6],['bell',659,1.6,.02,.6],['bell',784,2,.04,.6]], 1],
      ['Аккорд маримбой','тот же аккорд, но деревянный',   [['marimba',523,1.1,0,.8],['marimba',659,1.1,.01,.8],['marimba',784,1.4,.02,.8]]],
      ['Аккорд с раскатом','ноты входят одна за другой и остаются', [['kalimba',523,1.8,0,.8],['kalimba',659,1.7,.09,.8],['kalimba',784,2.2,.18,.8]]],
      ['Двойной аккорд','два аккорда подряд, второй выше', [['marimba',392,.7,0,.7],['marimba',494,.7,.01,.7],['marimba',587,.75,.02,.7],['marimba',523,1.2,.34,.8],['marimba',659,1.2,.35,.8],['marimba',784,1.5,.36,.8]]],
      ['Широкий аккорд','ноты далеко друг от друга, гулко',[['kalimba',262,2.4,0,.8],['kalimba',523,2.2,.02,.7],['kalimba',1047,2.0,.04,.5]]]
    ]}
  };

  var box=document.getElementById('groups');
  Object.keys(SIGNALS).forEach(function(key){
    var g=SIGNALS[key];
    var wrap=document.createElement('div'); wrap.className='group';
    var t=document.createElement('div'); t.className='gtitle'; t.textContent=g.title;
    var s=document.createElement('div'); s.className='gsub'; s.textContent=g.sub;
    wrap.appendChild(t); wrap.appendChild(s);
    g.items.forEach(function(it,i){
      var row=document.createElement('div'); row.className='row';
      var tag=document.createElement('span'); tag.className='tag'; tag.textContent=(i+1);
      var b=document.createElement('button');
      if(it[3])b.className='keep';
      b.appendChild(document.createTextNode(it[0]));
      var d=document.createElement('span'); d.className='desc'; d.textContent=it[1];
      b.appendChild(d);
      b.addEventListener('click',function(){ play(it[2]); });
      row.appendChild(tag); row.appendChild(b); wrap.appendChild(row);
    });
    box.appendChild(wrap);
  });

  var vol=document.getElementById('vol'), volval=document.getElementById('volval');
  vol.addEventListener('input',function(){
    master=vol.value/100; volval.textContent=vol.value+'%';
  });

  document.getElementById('playall').addEventListener('click',function(){
    ctx();
    play(SIGNALS.start.items[0][2]);
    setTimeout(function(){ play(SIGNALS.bike.items[0][2]); },1200);
    setTimeout(function(){ play(SIGNALS.warn.items[0][2]); },3000);
    setTimeout(function(){ play(SIGNALS.super.items[0][2]); },4400);
  });
})();
</script>
