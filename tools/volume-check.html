<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Громкость сигналов</title>
<style>
  :root{--bg:#FBFAF8;--panel:#F3F0EB;--line:#E4DED5;--ink:#1E2124;--dim:#71767C;
    --accent:#D97757;--soft:rgba(217,119,87,.13);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme:dark){
    :root{--bg:#15181B;--panel:#1E2328;--line:#2B3137;--ink:#ECE9E4;--dim:#8B9299;
      --accent:#E08A6D;--soft:rgba(224,138,109,.15)}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);display:flex;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{width:100%;max-width:420px;padding:26px 20px 40px}
  h1{font-size:18px;margin:0 0 6px}
  p{font-size:13px;line-height:1.5;color:var(--dim);margin:0 0 20px}

  .master{background:var(--panel);border-radius:14px;padding:13px 15px;margin-bottom:22px}
  .master label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}
  .master b{font-family:var(--mono);font-weight:500}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .note{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.45}

  button{display:flex;align-items:center;justify-content:space-between;gap:12px;
    width:100%;margin-bottom:10px;font-family:inherit;font-size:15px;font-weight:500;
    color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{background:var(--soft)}
  button .l{text-align:left}
  button .l span{display:block;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:2px}
  button .v{font-family:var(--mono);font-size:13px;color:var(--accent);flex:none}
  .all{background:var(--accent);border-color:var(--accent);color:#fff;
    justify-content:center;font-weight:600;margin-top:6px}
</style>

<div id="app">
  <h1>Громкость сигналов</h1>
  <p>Это те же пять звуков и та же громкость, что сейчас в таймере. Ползунок сверху меняет общий уровень — найди подходящий и назови число.</p>

  <div class="master">
    <label>Общая громкость <b id="mval">70%</b></label>
    <input type="range" id="m" min="30" max="100" value="70">
    <div class="note">В таймере сейчас стоит 70%. Проценты справа от кнопок — итоговая громкость каждого сигнала с учётом его собственного множителя.</div>
  </div>

  <div id="list"></div>
  <button class="all" id="all">Проиграть все подряд</button>
</div>

<script>
(function(){
  var AC=window.AudioContext||window.webkitAudioContext, ac=null, MASTER=.7;
  function ctx(){ if(!ac&&AC)ac=new AC(); if(ac&&ac.state==='suspended')ac.resume(); return ac; }

  function voice(inst,f,dur,delay,vol){
    var a=ctx(); if(!a)return;
    var t=a.currentTime+(delay||0), v=(vol===undefined?1:vol)*MASTER;
    var g=a.createGain(); g.connect(a.destination);
    var o=a.createOscillator(); o.type='sine'; o.frequency.value=f;
    if(inst==='bell'){
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.7,t+.004);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var p=a.createOscillator(), pg=a.createGain();
      p.type='sine'; p.frequency.value=f*2.76; pg.gain.value=.3;
      p.connect(pg); pg.connect(g); p.start(t); p.stop(t+dur);
    }else{
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v*.7,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      var k=a.createOscillator(), kg=a.createGain();
      k.type='sine'; k.frequency.value=f*3; kg.gain.value=.16;
      k.connect(kg); kg.connect(g); k.start(t); k.stop(t+dur*.55);
    }
    o.connect(g); o.start(t); o.stop(t+dur+.05);
  }

  // ровно то, что стоит в таймере
  var SIG=[
    ['Велосипед','две ноты вверх',1,function(){
      voice('kalimba',587,.75,0); voice('kalimba',880,1.0,.2); }],
    ['Супермен','две ноты вниз',1,function(){
      voice('kalimba',880,.75,0); voice('kalimba',523,1.1,.2); }],
    ['Старт','одна нота',.8,function(){
      voice('kalimba',523,.7,.08,.8); }],
    ['Предупреждение','двойной удар, за 10 сек до смены',.7,function(){
      voice('kalimba',740,.4,0,.7); voice('kalimba',740,.4,.17,.7); }],
    ['Финиш','колокольный аккорд',.6,function(){
      voice('bell',523,1.6,0,.6); voice('bell',659,1.6,.02,.6); voice('bell',784,2,.04,.6); }]
  ];

  var list=document.getElementById('list'), pctEls=[];
  SIG.forEach(function(s){
    var b=document.createElement('button');
    var l=document.createElement('div'); l.className='l';
    l.appendChild(document.createTextNode(s[0]));
    var sub=document.createElement('span'); sub.textContent=s[1]; l.appendChild(sub);
    var v=document.createElement('div'); v.className='v';
    b.appendChild(l); b.appendChild(v);
    b.addEventListener('click',function(){ ctx(); s[3](); });
    list.appendChild(b);
    pctEls.push([v,s[2]]);
  });

  function refresh(){
    pctEls.forEach(function(p){
      p[0].textContent=Math.round(MASTER*p[1]*100)+'%';
    });
  }
  refresh();

  var m=document.getElementById('m'), mval=document.getElementById('mval');
  m.addEventListener('input',function(){
    MASTER=m.value/100; mval.textContent=m.value+'%'; refresh();
  });

  document.getElementById('all').addEventListener('click',function(){
    ctx();
    SIG[2][3]();
    setTimeout(SIG[0][3],1300);
    setTimeout(SIG[3][3],3000);
    setTimeout(SIG[1][3],4300);
    setTimeout(SIG[4][3],6000);
  });
})();
</script>
